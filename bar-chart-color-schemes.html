<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鼓励视图 · 各目标完成百分比 柱状图配色方案</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e6e9f2;
    --text: #1f2430;
    --text-sub: #6b7280;
    --accent: #6c5ce7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px 60px;
    line-height: 1.6;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 8px; }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
  header p { color: var(--text-sub); font-size: 14px; margin-top: 8px; }
  .goal-card { color: var(--text-sub); font-size: 13px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin: 16px auto 28px; max-width: 620px; text-align: left; }
  .goal-card code { background: #eef1f7; padding: 1px 6px; border-radius: 4px; color: var(--accent); }

  .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 30px; }
  .tab {
    border: 1px solid var(--border); background: var(--card); color: var(--text-sub);
    padding: 10px 18px; border-radius: 999px; cursor: pointer; font-size: 14px;
    transition: all .18s ease; font-weight: 500;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 14px rgba(108,92,231,.28); }

  .scheme { display: none; animation: fade .3s ease; }
  .scheme.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none;} }

  .scheme-head { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-bottom: 20px; }
  .scheme-head h2 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .scheme-head .desc { color: var(--text-sub); font-size: 13.5px; margin-top: 8px; }
  .scheme-head .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #eef1f7; color: #4b5563; }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .swatch { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .swatch:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
  .swatch .color { height: 56px; }
  .swatch .meta { padding: 8px 10px; font-size: 12px; }
  .swatch .hex { font-weight: 600; letter-spacing: .3px; display: block; }
  .swatch .rgb { color: var(--text-sub); display: block; margin-top: 2px; }
  .swatch .copy-tip { font-size: 11px; color: var(--accent); opacity: 0; transition: opacity .15s; }
  .swatch.copied .copy-tip { opacity: 1; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .panel h3 { font-size: 15px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .panel h3 .mode-tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: #eef1f7; color: var(--text-sub); }
  .panel.dark-mode { background: #141a26; border-color: #232c3d; }
  .panel.dark-mode h3 { color: #e6e9f2; }
  .panel.dark-mode .mode-tag { background: #2a3546; color: #aeb9cd; }

  .chart { display: flex; align-items: flex-end; gap: 18px; height: 240px; padding: 0 6px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-wrap { display: flex; align-items: flex-end; height: 100%; width: 100%; }
  .bar {
    width: 100%; border-radius: 6px 6px 2px 2px; position: relative;
    transition: height .5s cubic-bezier(.34,1.2,.4,1);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.06);
  }
  .col .label { margin-top: 10px; font-size: 12px; white-space: nowrap; }
  .col .pct { font-size: 12px; font-weight: 600; margin-bottom: 6px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { opacity: .9; color: #fff; }
  .btn.active-b { background: var(--accent); color: #fff; border-color: var(--accent); }

  .code-block {
    background: #0e1420; color: #c9d6ee; font-family: "SF Mono", Consolas, Menlo, monospace;
    padding: 14px 16px; border-radius: 10px; font-size: 12.5px; line-height: 1.9; overflow-x: auto; white-space: pre;
  }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(80px);
    background: #1f2430; color: #fff; padding: 10px 22px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: all .25s ease; z-index: 99; box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  footer { text-align: center; color: var(--text-sub); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>各目标完成百分比 · 柱状图配色方案</h1>
    <p>为「鼓励视图」目标完成柱状图提供 4 套现代、协调、可区分的可选配色</p>
  </header>

  <div class="goal-card">
    应用场景：<code>src/views/StatsView.vue</code> 中 <code>renderBarChart()</code> 完成度柱状图。
    当前实现按完成度阈值单色着色（≥80 绿 / ≥50 橙 / ≥20 红 / 其余灰）。以下方案改为<strong>每目标一色（分类色）</strong>，
    便于在柱图上快速区分不同目标，同时保留高饱和度与适度对比。
  </div>

  <nav class="tabs" id="tabs"></nav>

  <!-- 方案容器 -->
  <div id="schemes"></div>

  <div class="toast" id="toast"></div>
  <footer>点击色块或「复制全部 HEX」即可复制色值 · 点击柱状图右上角色块可滚动到对应代码段</footer>
</div>

<script>
// 示例数据：各目标完成百分比（用于柱状图预览）
const sample = [
  { name: "目标A", pct: 92 },
  { name: "目标B", pct: 76 },
  { name: "目标C", pct: 63 },
  { name: "目标D", pct: 48 },
  { name: "目标E", pct: 31 },
  { name: "目标F", pct: 17 },
  { name: "目标G", pct: 8 },
];

const schemes = [
  {
    id: "sunrise",
    name: "方案一 · 晨曦活力",
    icon: "🌅",
    theme: "暖色为主、点缀清新冷色，能量积极向上",
    desc: "以温暖明亮的珊瑚、橙、金黄为基调，辅以清新绿与天蓝、鸢尾紫。整体热情鼓舞，适合作为「鼓励视图」的默认动感配色；各色相邻色相差异明显，识别度高。",
    badges: ["暖色系", "高能量", "推荐默认"],
    darkLabel: "#f7f2fb",
    colors: [
      { hex: "#FF6D6A", rgb: "rgb(255,109,106)", name: "珊瑚红" },
      { hex: "#FF8A3C", rgb: "rgb(255,138,60)",  name: "活力橙" },
      { hex: "#FFC14D", rgb: "rgb(255,193,77)",  name: "金辉黄" },
      { hex: "#5BC98E", rgb: "rgb(91,201,142)",  name: "清新绿" },
      { hex: "#4DA6FF", rgb: "rgb(77,166,255)",  name: "天蓝" },
      { hex: "#8B7CF6", rgb: "rgb(139,124,246)", name: "鸢尾紫" },
      { hex: "#F26BA5", rgb: "rgb(242,107,165)", name: "樱花粉" },
    ],
  },
  {
    id: "ocean",
    name: "方案二 · 冷静清爽",
    icon: "🌊",
    theme: "冷色青蓝为主，现代大屏仪表盘风格",
    desc: "以深蓝、湖青、薄荷绿构成冷色主链，再用柠檬黄与暖沙橙做提亮点缀。冷静而不失明快，适合长时间阅读与各目标间明显区分，弱光下表现稳定。",
    badges: ["冷色系", "现代清爽", "适合深色场景"],
    colors: [
      { hex: "#4D9DE0", rgb: "rgb(77,157,224)",  name: "深海蓝" },
      { hex: "#28C4D9", rgb: "rgb(40,196,217)",  name: "湖青" },
      { hex: "#4BC0A9", rgb: "rgb(75,192,169)",  name: "薄荷绿" },
      { hex: "#9AC85A", rgb: "rgb(154,200,90)",  name: "草木绿" },
      { hex: "#FFC84B", rgb: "rgb(255,200,75)",  name: "柠檬黄" },
      { hex: "#FF8A5C", rgb: "rgb(255,138,92)",  name: "暖沙橙" },
      { hex: "#C77EB0", rgb: "rgb(199,126,176)", name: "丁香紫" },
    ],
  },
  {
    id: "morandi",
    name: "方案三 · 柔和莫兰迪",
    icon: "🕊",
    theme: "低饱和莫兰迪，优雅耐看，适合浅色界面",
    desc: "整体降低饱和与明度，色泽内敛雅致，配合留白显得高级。各色明度相近、对比适中不刺眼，数据清晰易读，尤其适合浅色背景与打印场景。",
    badges: ["低饱和", "优雅内敛", "适合浅色/打印"],
    colors: [
      { hex: "#87A0C9", rgb: "rgb(135,160,201)", name: "雾蓝" },
      { hex: "#8FBCB3", rgb: "rgb(143,188,179)", name: "湖水绿" },
      { hex: "#A8C68F", rgb: "rgb(168,198,143)", name: "豆沙绿" },
      { hex: "#E3C078", rgb: "rgb(227,192,120)", name: "亚麻黄" },
      { hex: "#E8A0A0", rgb: "rgb(232,160,160)", name: "藕荷粉" },
      { hex: "#C9A5D6", rgb: "rgb(201,165,214)", name: "丁香紫" },
      { hex: "#D9A97C", rgb: "rgb(217,169,124)", name: "浅卡其" },
    ],
  },
  {
    id: "night",
    name: "方案四 · 夜间霓虹",
    icon: "🌙",
    theme: "高饱和亮色，专为深色模式亮度优化",
    desc: "面向深色背景的高饱和霓虹系，在所有明度下保持饱和度与亮度，避免深色模式下沉闷发灰。相邻色相拉开距离，即便在昏暗环境下也能快速对目标。",
    badges: ["高饱和", "深色强化", "夜间友好"],
    colors: [
      { hex: "#FF8787", rgb: "rgb(255,135,135)", name: "淡珊瑚粉" },
      { hex: "#FFA94D", rgb: "rgb(255,169,77)",  name: "亮橙" },
      { hex: "#FFD43B", rgb: "rgb(255,212,59)",  name: "明黄" },
      { hex: "#69DB7C", rgb: "rgb(105,219,124)", name: "荧光绿" },
      { hex: "#4DABF7", rgb: "rgb(77,171,247)",  name: "萤光蓝" },
      { hex: "#9775FA", rgb: "rgb(151,117,250)", name: "亮紫" },
      { hex: "#F783AC", rgb: "rgb(247,131,172)", name: "霓虹粉" },
    ],
  },
];

const tabsEl = document.getElementById("tabs");
const schemesEl = document.getElementById("schemes");
const toastEl = document.getElementById("toast");
let toastTimer = null;

function cssHex(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
}
async function copy(text, tip) {
  try { await navigator.clipboard.writeText(text); }
  catch(_) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  if (tip) showToast(tip);
}

function buildChart(colors, dark) {
  const cols = sample.map((s, i) => {
    const c = colors[i % colors.length];
    const [r,g,b] = cssHex(c.hex);
    const label = dark ? "#c7d2e5" : "#334155";
    const pctColor = dark ? "#e6e9f2" : "#1f2430";
    return `<div class="col">
      <div class="bar-wrap"><div class="bar" style="height:${s.pct}%;background:linear-gradient(180deg,${c.hex},rgba(${r},${g},${b},.82))" data-tip="${s.name} ${s.pct}%"></div></div>
      <div class="pct" style="color:${pctColor}">${s.pct}%</div>
      <div class="label" style="color:${label}">${s.name}</div>
    </div>`;
  }).join("");
  return cols;
}

function buildScheme(s) {
  const el = document.createElement("section");
  el.className = "scheme";
  el.id = "scheme-" + s.id;

  const swatches = s.colors.map((c) => `
    <div class="swatch" data-full="${c.hex} ${c.rgb}" data-idx="${s.id}">
      <div class="color" style="background:${c.hex}"></div>
      <div class="meta">
        <span class="hex">${c.hex}</span>
        <span class="rgb">${c.rgb}</span>
        <span class="copy-tip">✓ 已复制</span>
      </div>
    </div>`).join("");

  const paletteJs = s.colors.map(c => c.hex).join(", ");
  const paletteArr = s.colors.map(c => `"${c.hex}"`).join(", ");

  el.innerHTML = `
    <div class="scheme-head">
      <h2><span>${s.icon}</span>${s.name}</h2>
      <div class="desc">${s.theme}<br>${s.desc}</div>
      <div class="badges">${s.badges.map(b => `<span class="badge">${b}</span>`).join("")}</div>
    </div>

    <div class="panel">
      <h3>色卡 · ${s.colors.length} 种协调颜色</h3>
      <div class="swatches">${swatches}</div>
      <div class="actions">
        <button class="btn primary" data-copy-hex-scheme="${s.id}">复制全部 HEX</button>
        <button class="btn" data-copy-arr-scheme="${s.id}">复制数组代码</button>
      </div>
    </div>

    <div class="panel">
      <h3>浅色背景预览 <span class="mode-tag">Light</span><span style="margin-left:auto;font-weight:400;font-size:12px;color:var(--text-sub)">每个目标一根独立颜色的柱</span></h3>
      <div class="chart">${buildChart(s.colors, false)}</div>
    </div>

    <div class="panel dark-mode">
      <h3>深色背景预览 <span class="mode-tag">Dark</span></h3>
      <div class="chart">${buildChart(s.colors, true)}</div>
    </div>

    <div class="panel">
      <h3>ECharts 可直接粘贴的代码</h3>
      <div class="code-block" id="code-${s.id}">// ${s.name}
// itemStyle.color 改为根据 dataIndex 取色即可
const PALETTE = [${paletteArr}];
// series: {
//   itemStyle: { color: (p) => PALETTE[p.dataIndex % PALETTE.length] }
// }</div>
      <div class="actions" style="margin-top:14px">
        <button class="btn primary" data-copy-code="${s.id}">复制代码</button>
      </div>
    </div>
  `;
  schemesEl.appendChild(el);
}

// 构建导航与渲染
schemes.forEach(buildScheme);
tabsEl.innerHTML = schemes.map((s,i) =>
  `<button class="tab${i===0?' active':''}" data-tab="${s.id}"><span>${s.icon}</span> ${s.name}</button>`
).join("");

let active = schemes[0].id;
function activate(id) {
  active = id;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === id));
  document.querySelectorAll(".scheme").forEach(s => s.classList.toggle("active", s.id === "scheme-"+id));
}
tabsEl.addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (tab) activate(tab.dataset.tab);
});

// 交互：复制
schemesEl.addEventListener("click", async (e) => {
  const sw = e.target.closest(".swatch");
  if (sw) {
    await copy(sw.dataset.full, `已复制 ${sw.dataset.full}`);
    sw.classList.add("copied");
    setTimeout(() => sw.classList.remove("copied"), 900);
    return;
  }
  const hb = e.target.closest("[data-copy-hex-scheme]");
  if (hb) {
    await copy(schemes.find(s=>s.id===hb.dataset.copyHexScheme).colors.map(c=>c.hex).join(" "), "已复制全部 HEX");
    return;
  }
  const ab = e.target.closest("[data-copy-arr-scheme]");
  if (ab) {
    await copy("[" + schemes.find(s=>s.id===ab.dataset.copyArrScheme).colors.map(c=>`"${c.hex}"`).join(", ") + "]", "已复制数组代码");
    return;
  }
  const cb = e.target.closest("[data-copy-code]");
  if (cb) {
    const s = schemes.find(x=>x.id===cb.dataset.copyCode);
    await copy(`// ${s.name}
const PALETTE = [${s.colors.map(c=>`"${c.hex}"`).join(", ")}];
// itemStyle: { color: (p) => PALETTE[p.dataIndex % PALETTE.length] }`, "已复制代码");
    return;
  }
});
</script>
</body>
</html>
