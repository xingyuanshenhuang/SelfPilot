[package]
name = "self-study-planner"
version = "0.1.0"
edition = "2021"
description = "SelfPilot 自学计划任务规划桌面应用"

[lib]
name = "self_study_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rand = "0.8"
# S-04 (SEC-M-04)：错误脱敏 + 结构化日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# S-05 (SEC-M-05)：入参校验
validator = { version = "0.18", features = ["derive"] }

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
